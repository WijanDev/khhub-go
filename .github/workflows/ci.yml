name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read
  packages: write

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Go format and vet
        working-directory: backend
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi
          go vet ./...
      - name: Go tests
        working-directory: backend
        run: go test ./...
      - name: Frontend lint and build
        working-directory: frontend
        env:
          VITE_API_URL: https://api.khhub.app
        run: npm ci && npm run lint && npm run build

  changes:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.out.outputs.api }}
      web: ${{ steps.out.outputs.web }}
    steps:
      - name: Detect first push on the branch
        id: first
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "both=true" >> "$GITHUB_OUTPUT"
          else
            echo "both=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.first.outputs.both != 'true'
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        if: steps.first.outputs.both != 'true'
        with:
          filters: |
            api:
              - 'backend/**'
              - '!backend/**/*_test.go'
              - '!backend/**/testdata/**'
            web:
              - 'frontend/**'
              - '!frontend/**/*.test.ts'
              - '!frontend/**/*.test.tsx'
              - '!frontend/**/*.spec.ts'
              - '!frontend/**/*.spec.tsx'
              - '!frontend/**/__tests__/**'
      - name: Set image outputs
        id: out
        run: |
          if [ "${{ steps.first.outputs.both }}" = "true" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=${{ steps.filter.outputs.api }}" >> "$GITHUB_OUTPUT"
            echo "web=${{ steps.filter.outputs.web }}" >> "$GITHUB_OUTPUT"
          fi

  images:
    needs: [secrets, test, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && (needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push API
        if: needs.changes.outputs.api == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/wijandev/khhub-api:${{ github.sha }}
            ghcr.io/wijandev/khhub-api:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push web
        if: needs.changes.outputs.web == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/wijandev/khhub-web:${{ github.sha }}
            ghcr.io/wijandev/khhub-web:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trigger staging API
        if: needs.changes.outputs.api == 'true'
        env:
          HOOK: ${{ secrets.DOKPLOY_STAGING_API_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "DOKPLOY_STAGING_API_HOOK not set; skip staging API trigger"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
      - name: Trigger staging web
        if: needs.changes.outputs.web == 'true'
        env:
          HOOK: ${{ secrets.DOKPLOY_STAGING_WEB_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "DOKPLOY_STAGING_WEB_HOOK not set; skip staging web trigger"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"

  promote:
    needs: [secrets, test, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Promote staging API to latest
        if: needs.changes.outputs.api == 'true'
        run: |
          docker buildx imagetools create \
            -t ghcr.io/wijandev/khhub-api:latest \
            ghcr.io/wijandev/khhub-api:staging
      - name: Promote staging web to latest
        if: needs.changes.outputs.web == 'true'
        run: |
          docker buildx imagetools create \
            -t ghcr.io/wijandev/khhub-web:latest \
            ghcr.io/wijandev/khhub-web:staging
      - name: Trigger production API
        if: needs.changes.outputs.api == 'true'
        env:
          HOOK: ${{ secrets.DOKPLOY_PROD_API_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "DOKPLOY_PROD_API_HOOK not set; skip production API trigger"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
      - name: Trigger production web
        if: needs.changes.outputs.web == 'true'
        env:
          HOOK: ${{ secrets.DOKPLOY_PROD_WEB_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "DOKPLOY_PROD_WEB_HOOK not set; skip production web trigger"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
