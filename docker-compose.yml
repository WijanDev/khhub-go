# Full stack for Dokploy. API and web images are built in GitHub Actions
# and pulled from GHCR. Postgres data stays on the VPS.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-khhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-khhub}
    volumes:
      - khhub_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-khhub} -d ${POSTGRES_DB:-khhub}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - khhub

  api:
    image: ${KHHUB_API_IMAGE:-ghcr.io/wijandev/khhub-api:latest}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-khhub}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-khhub}?sslmode=disable
      CORS_ORIGINS: ${CORS_ORIGINS:-https://khhub.app}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - khhub

  web:
    image: ${KHHUB_WEB_IMAGE:-ghcr.io/wijandev/khhub-web:latest}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - khhub

volumes:
  khhub_pg:

networks:
  khhub:
    driver: bridge
